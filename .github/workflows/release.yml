name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openappx
        run: python -m pip install openappx

      - name: Restore dependencies
        run: dotnet restore IconOverlay.csproj

      - name: Publish portable application
        run: |
          dotnet publish IconOverlay.csproj -c Release -p:PublishProfile=PortableExe

      - name: Publish MSIX layout
        run: dotnet publish IconOverlay.csproj -c Release -p:PublishProfile=Msix

      - name: Remove debug symbols
        run: |
          find publish/portable publish/msix -type f -name '*.pdb' -delete

      - name: Prepare portable ZIP
        run: |
          cd publish/portable
          zip -qr ../IconOverlay-portable.zip .

      - name: Add .txt extension to LICENSE in MSIX package
        run: |
          mv publish/msix/LICENSE publish/msix/LICENSE.txt

      - name: Set MSIX version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          VERSION_NAME="${VERSION_NAME#v}.0"
          export VERSION_NAME
          envsubst '${VERSION_NAME}' < publish/msix/AppxManifest.xml > publish/msix/AppxManifest.xml.tmp
          mv publish/msix/AppxManifest.xml.tmp publish/msix/AppxManifest.xml

      - name: Package unsigned MSIX
        run: |
          openappx pack \
            --root publish/msix \
            --out publish/IconOverlay-unsigned.msix

      - name: Upload unsigned MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-msix
          path: publish/IconOverlay-unsigned.msix
          if-no-files-found: error
          retention-days: 1

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }} 
        run: |
          gh release create "$GITHUB_REF_NAME" \
            publish/IconOverlay-portable.zip \
            certificates/IconOverlay.cer \
            --draft \
            --generate-notes \
            --title "IconOverlay $GITHUB_REF_NAME"